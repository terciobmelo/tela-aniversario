<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#C8102E">
  <title>战斗不能停止。</title>
  <link rel="preload" as="image" href="fundo.png?v=3">
  <link rel="preload" as="image" href="letreiro.png?v=4">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    /* "Tela de celular": ocupa tudo no celular, 430px centralizado no computador */
    #app {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;   /* fallback */
      height: 100dvh;
      overflow: hidden;
    }

    .tela {
      position: absolute;
      inset: 0;
    }

    /* ---------- Tela 2 (fica por baixo) ---------- */
    #tela-final {
      background: #000 url("fundo.png?v=3") center / cover no-repeat;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8vh;   /* fallback */
      padding-top: 8dvh;  /* 8% da altura da tela */
    }

    #letreiro {
      display: block;
      max-width: 80%;
      max-height: 80%;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    #letreiro.ligando {
      animation:
        neon-liga 2.4s linear forwards,
        neon-pulsa 3s ease-in-out 2.4s infinite;
    }

    /* Piscadas irregulares como neon ligando (4 piscadas) e depois aceso */
    @keyframes neon-liga {
      0%   { opacity: 0;   filter: none; }
      6%   { opacity: 1;   filter: drop-shadow(0 0 6px rgba(255,220,0,.55)); }
      9%   { opacity: 0;   filter: none; }
      22%  { opacity: 0;   filter: none; }
      24%  { opacity: .9;  filter: drop-shadow(0 0 8px rgba(255,220,0,.55)); }
      26%  { opacity: .2;  filter: none; }
      28%  { opacity: 1;   filter: drop-shadow(0 0 8px rgba(255,220,0,.55)); }
      32%  { opacity: 0;   filter: none; }
      50%  { opacity: 0;   filter: none; }
      52%  { opacity: 1;   filter: drop-shadow(0 0 10px rgba(255,220,0,.6)); }
      58%  { opacity: 1;   filter: drop-shadow(0 0 10px rgba(255,220,0,.6)); }
      60%  { opacity: 0;   filter: none; }
      70%  { opacity: 0;   filter: none; }
      72%  { opacity: 1;   filter: drop-shadow(0 0 8px rgba(255,220,0,.6)) drop-shadow(0 0 20px rgba(255,80,0,.4)); }
      100% { opacity: 1;   filter: drop-shadow(0 0 8px rgba(255,220,0,.6)) drop-shadow(0 0 20px rgba(255,80,0,.4)); }
    }

    /* Brilho leve e contínuo depois de aceso */
    @keyframes neon-pulsa {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255,220,0,.6)) drop-shadow(0 0 20px rgba(255,80,0,.4)); }
      50%      { opacity: 1; filter: drop-shadow(0 0 11px rgba(255,220,0,.7)) drop-shadow(0 0 26px rgba(255,80,0,.5)); }
    }

    /* Botão discreto de pausar/tocar a música */
    #som {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      z-index: 1;
      width: 40px;
      height: 40px;
      min-height: 0;
      padding: 0;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;
      background: rgba(0,0,0,.35);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease, transform .1s ease;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }

    #som.visivel {
      opacity: .75;
      pointer-events: auto;
    }

    #som svg { width: 18px; height: 18px; fill: currentColor; }
    #som .icone-tocar { display: none; }
    #som.pausado .icone-pausar { display: none; }
    #som.pausado .icone-tocar { display: block; }

    /* ---------- Tela 1 (por cima) ---------- */
    #tela-inicio {
      z-index: 2;
      background: #C8102E;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left));
      opacity: 1;
      transition: opacity .8s ease;
    }

    #tela-inicio.saindo {
      opacity: 0;
      pointer-events: none;
    }

    #tela-inicio h1 {
      font-size: clamp(26px, 8vw, 34px);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      max-width: 340px;
    }

    form {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      min-height: 60px;
      padding: 0 18px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 14px;
      background: #fff;
      color: #222;
      font-size: 20px; /* >= 16px evita zoom automático no iOS */
      font-family: inherit;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input[type="date"]::-webkit-date-and-time-value { text-align: center; }

    input[type="date"]:focus {
      outline: 3px solid rgba(255,220,0,.55);
      outline-offset: 2px;
    }

    input[type="date"].tremendo {
      animation: tremer .45s ease;
    }

    @keyframes tremer {
      0%, 100% { transform: translateX(0); }
      15%      { transform: translateX(-8px); }
      30%      { transform: translateX(7px); }
      45%      { transform: translateX(-5px); }
      60%      { transform: translateX(4px); }
      75%      { transform: translateX(-2px); }
    }

    .erro {
      margin-top: -6px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      color: #fff;
    }

    button {
      width: 100%;
      min-height: 60px;
      border: none;
      border-radius: 14px;
      background: #fff;
      color: #C8102E;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: .5px;
      cursor: pointer;
      transition: transform .1s ease, opacity .2s ease;
    }

    button:active:not(:disabled) { transform: scale(.97); }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="tela-final" class="tela" aria-hidden="true">
      <img id="letreiro" src="letreiro.png?v=4" alt="Letreiro">
      <button type="button" id="som" aria-label="Pausar música">
        <svg class="icone-pausar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <svg class="icone-tocar" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </section>
    <audio id="musica" src="musica.mp3" loop preload="auto"></audio>

    <section id="tela-inicio" class="tela">
      <h1>Informe sua data de nascimento.</h1>
      <form id="form-data" novalidate>
        <input type="date" id="data" required aria-label="Data de nascimento" aria-describedby="erro">
        <p id="erro" class="erro" role="alert" hidden>Data incorreta. Tente novamente.</p>
        <button type="submit" id="entrar" disabled>Entrar</button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var inicio = document.getElementById('tela-inicio');
      var final = document.getElementById('tela-final');
      var form = document.getElementById('form-data');
      var data = document.getElementById('data');
      var entrar = document.getElementById('entrar');
      var letreiro = document.getElementById('letreiro');
      var erro = document.getElementById('erro');
      var DATA_CORRETA = '2004-01-17'; // 17/01/2004 (o campo devolve AAAA-MM-DD)
      var entrou = false;
      var musica = document.getElementById('musica');
      var som = document.getElementById('som');
      var FADE_MUSICA = 2; // segundos

      // Começa a música com o volume subindo aos poucos.
      // No iPhone o volume do <audio> não pode ser mudado por código,
      // então o fade é feito pela Web Audio API (no site publicado).
      // Abrindo o arquivo direto do computador (file://) usa o volume normal.
      function tocarMusicaComFade() {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx && location.protocol !== 'file:') {
          try {
            var ctx = new Ctx();
            var ganho = ctx.createGain();
            ctx.createMediaElementSource(musica).connect(ganho);
            ganho.connect(ctx.destination);
            ganho.gain.setValueAtTime(0.0001, ctx.currentTime);
            ganho.gain.exponentialRampToValueAtTime(1, ctx.currentTime + FADE_MUSICA);
            if (ctx.state === 'suspended') ctx.resume();
            return tocar();
          } catch (err) { /* cai no fade pelo volume */ }
        }
        musica.volume = 0;
        var inicio = null;
        function passo(t) {
          if (inicio === null) inicio = t;
          var p = Math.min((t - inicio) / (FADE_MUSICA * 1000), 1);
          musica.volume = p;
          if (p < 1) requestAnimationFrame(passo);
        }
        requestAnimationFrame(passo);
        tocar();
      }

      function tocar() {
        var promessa = musica.play();
        if (promessa && promessa.catch) {
          promessa.catch(function () { atualizarBotaoSom(); });
        }
      }

      function atualizarBotaoSom() {
        var pausado = musica.paused;
        som.classList.toggle('pausado', pausado);
        som.setAttribute('aria-label', pausado ? 'Tocar música' : 'Pausar música');
      }
      musica.addEventListener('play', atualizarBotaoSom);
      musica.addEventListener('pause', atualizarBotaoSom);

      som.addEventListener('click', function () {
        if (musica.paused) tocar(); else musica.pause();
      });

      function atualizarBotao() {
        entrar.disabled = !data.value;
        erro.hidden = true; // some assim que a pessoa mexe na data de novo
      }
      data.addEventListener('input', atualizarBotao);
      data.addEventListener('change', atualizarBotao);

      function mostrarErro() {
        erro.hidden = false;
        data.classList.remove('tremendo');
        void data.offsetWidth; // reinicia a animação se errar de novo
        data.classList.add('tremendo');
      }
      data.addEventListener('animationend', function () {
        data.classList.remove('tremendo');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!data.value || entrou) return;
        if (data.value !== DATA_CORRETA) {
          mostrarErro();
          return;
        }
        entrou = true;
        data.blur();
        tocarMusicaComFade(); // precisa ser dentro do clique para o celular deixar tocar
        som.classList.add('visivel');

        inicio.classList.add('saindo');
        final.setAttribute('aria-hidden', 'false');

        // 0,8s de fade + 1s de espera antes do letreiro acender
        setTimeout(function () {
          inicio.style.display = 'none';
        }, 800);
        setTimeout(function () {
          letreiro.classList.add('ligando');
        }, 800 + 1000);
      });

      // Bloqueia zoom por pinça / duplo toque (iOS ignora user-scalable=no)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      var ultimoToque = 0;
      document.addEventListener('touchend', function (e) {
        var agora = Date.now();
        if (agora - ultimoToque < 300 && !e.target.closest('input, button')) e.preventDefault();
        ultimoToque = agora;
      }, { passive: false });
    })();
  </script>
</body>
</html>
